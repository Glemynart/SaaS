name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saas_ci
      JWT_SECRET: ci-only-ci-secret
      STORAGE_PROVIDER: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate staging Compose configuration
        run: |
          docker compose --project-name dusema-staging-isolated \
            --env-file deploy/staging.env.example \
            -f deploy/docker-compose.staging.yml config --format json |
            jq -e '
              . as $compose
              | ($compose.services.api.networks["la-oficina-nitida"].aliases // []) as $aliases
              | $compose.services.api.environment as $environment
              | (
                  $compose.name == "dusema-staging-isolated"
                  and ($compose.services | keys == ["api"])
                  and ($aliases | index("dusema-staging-api") != null)
                  and $environment.STORAGE_PROVIDER == "r2"
                  and $environment.REQUIRE_REAL_EMAIL == "true"
                  and ($environment.R2_ENDPOINT // "") != ""
                  and ($environment.R2_ACCESS_KEY_ID // "") != ""
                  and ($environment.R2_SECRET_ACCESS_KEY // "") != ""
                  and ($environment.R2_BUCKET // "") != ""
                  and ((.services.api.volumes // []) | length == 0)
                )
            '

      - name: Test PostgreSQL runtime role isolation bootstrap
        env:
          POSTGRES_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash deploy/postgres/test-runtime-role-bootstrap.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @saas/api exec prisma generate

      - name: Prepare database
        run: pnpm --filter @saas/api exec prisma migrate deploy

      - name: Build shared types
        run: pnpm --filter @saas/types build

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @saas/api exec jest --maxWorkers=2

      - name: Validate Prisma schema
        run: pnpm --filter @saas/api exec prisma validate

      - name: Build
        run: pnpm build
