name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saas_ci
      JWT_SECRET: ci-only-ci-secret
      STORAGE_PROVIDER: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @saas/api exec prisma generate

      - name: Prepare database
        run: pnpm --filter @saas/api exec prisma migrate deploy

      - name: Build shared types
        run: pnpm --filter @saas/types build

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @saas/api exec jest --runInBand

      - name: Validate Prisma schema
        run: pnpm --filter @saas/api exec prisma validate

      - name: Build
        run: pnpm build
