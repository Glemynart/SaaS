name: Browser E2E

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Keep the browser runner on an OS supported by the Playwright version pinned in pnpm-lock.yaml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saas_e2e
      JWT_SECRET: ci-only-e2e-secret
      # Public, disposable key used only by this ephemeral CI database.
      AUDIT_LOG_SIGNING_KEY: Z29hbDAyLWRpc3Bvc2FibGUtYXVkaXQtc2lnbmluZy1rZXktZm9yLXRlc3RzLW9ubHk=
      AUDIT_LOG_SIGNING_KEY_ID: ci-test-v1
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /tmp/saas-e2e-storage
      API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm --filter @saas/api exec prisma generate
          docker exec "${{ job.services.postgres.id }}" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d saas_e2e \
            -c 'CREATE ROLE saas_ci_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS'
          docker exec "${{ job.services.postgres.id }}" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d saas_e2e \
            -c "COMMENT ON ROLE saas_ci_runtime IS 'dusema:goal01-staging-runtime'"
          docker exec "${{ job.services.postgres.id }}" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d saas_e2e \
            -c 'GRANT CONNECT ON DATABASE saas_e2e TO saas_ci_runtime'
          docker exec "${{ job.services.postgres.id }}" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d saas_e2e \
            -c 'GRANT USAGE ON SCHEMA public TO saas_ci_runtime'
          docker exec "${{ job.services.postgres.id }}" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d saas_e2e \
            -c 'ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO saas_ci_runtime'
          docker exec "${{ job.services.postgres.id }}" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d saas_e2e \
            -c 'ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO saas_ci_runtime'
          pnpm --filter @saas/api exec prisma migrate deploy
          docker exec -i \
            -e AUDIT_LOG_SIGNING_KEY="$AUDIT_LOG_SIGNING_KEY" \
            -e AUDIT_LOG_SIGNING_KEY_ID="$AUDIT_LOG_SIGNING_KEY_ID" \
            "${{ job.services.postgres.id }}" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d saas_e2e \
            < deploy/postgres/provision-audit-log-signing-key.sql

      - name: Build applications
        run: |
          pnpm --filter @saas/types build
          pnpm --filter @saas/api build
          pnpm --filter @saas/web build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke
        run: pnpm test:e2e

      - name: Resolve browser evidence policy
        id: browser-evidence-policy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            printf 'upload=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! labels="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name' 2>/dev/null)"; then
            echo "::warning::Could not verify pull request labels; skipping browser evidence upload."
            printf 'upload=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fxq 'no-browser-evidence' <<< "$labels"; then
            printf 'upload=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'upload=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload browser evidence
        if: >-
          ${{ failure() && steps.browser-evidence-policy.outputs.upload == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-e2e-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
