name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saas_e2e
      JWT_SECRET: ci-only-e2e-secret
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /tmp/saas-e2e-storage
      API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm --filter @saas/api exec prisma generate
          pnpm --filter @saas/api exec prisma migrate deploy

      - name: Build applications
        run: |
          pnpm --filter @saas/types build
          pnpm --filter @saas/api build
          pnpm --filter @saas/web build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
